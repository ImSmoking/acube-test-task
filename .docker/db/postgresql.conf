# PostgreSQL configuration for development/testing
# Increase max connections to prevent "too many clients" errors during tests

# Allow connections from other Docker containers
listen_addresses = '*'

max_connections = 1000
shared_buffers = 256MB

# Logging (optional, useful for debugging)
log_statement = 'none'
log_duration = off

# Performance tuning for development
work_mem = 16MB
maintenance_work_mem = 128MB
