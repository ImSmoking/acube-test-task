services:
    db:
        container_name: "${PROJECT_NAME}_db"
        image: postgres:17
        command: postgres -c config_file=/etc/postgresql/postgresql.conf
        volumes:
            - './.docker/db:/docker-entrypoint-initdb.d'
            - 'db_data:/var/lib/postgresql/data'
            - './.docker/db/postgresql.conf:/etc/postgresql/postgresql.conf'
        environment:
            POSTGRES_DB: 'file_converter'
            POSTGRES_USER: 'file_converter'
            POSTGRES_PASSWORD: 'password'
        ports:
            - '5432:5432'
        networks:
            - file_converter_network

    php:
        build:
            context: .docker/php-fpm
            dockerfile: Dockerfile
            args:
                - DOCKER_UID=${DOCKER_UID:-1000}
                - DOCKER_GID=${DOCKER_GID:-1000}
        container_name: "${PROJECT_NAME}_php"
        working_dir: /app
        volumes:
            - .:/app
            - ./.docker/php-fpm/custom.ini:/usr/local/etc/php/conf.d/custom.ini
            #- ./.docker/php-fpm/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini #uncomment to activate
        environment:
            PHP_IDE_CONFIG: 'serverName=localhost:80' # phpStorm->Settings->PHP->Servers[Name:]
            XDEBUG_CLIENT_HOST: 172.17.0.1
        networks:
            - file_converter_network

    nginx:
        image: nginx:1.24-alpine
        container_name: "${PROJECT_NAME}_nginx"
        volumes:
            - .:/app
            - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        ports:
            - "80:80"
        networks:
            - file_converter_network
volumes:
    db_data:

networks:
    file_converter_network:
        driver: bridge
